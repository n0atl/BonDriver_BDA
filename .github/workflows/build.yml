name: Build BonDriver_BDA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
        configuration: [Release, Release_Static]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build DLL and dependencies
        shell: pwsh
        run: ./scripts/build.ps1 -Platform '${{ matrix.platform }}' -Configuration '${{ matrix.configuration }}'
      - name: Upload DLL and sample configuration
        uses: actions/upload-artifact@v6
        with:
          name: BonDriver_BDA-DeletePID002F-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            ${{ matrix.platform }}/${{ matrix.configuration }}/BonDriver_BDA.dll
            doc/BonDriver_BDA.sample.ini
            doc/BonDriver_BDA-UHF-sample.ini
            doc/BonDriver_BDA-DVBC-J83C-sample.ini
            doc/BUILD-DeletePID002F.md
          if-no-files-found: error
